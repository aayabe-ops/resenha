# Postgres só para desenvolvimento local (spec, seção 6). As credenciais
# abaixo são de uso local; nunca use estes valores fora da sua máquina.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resenha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenha}
      POSTGRES_DB: ${POSTGRES_DB:-resenha}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
